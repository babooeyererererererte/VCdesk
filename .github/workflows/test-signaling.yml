name: Test VCDesk signaling server

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Check health endpoint
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 \
              https://vcdesk-signaling-babooeyererererererte.onrender.com/health \
              -o health.json; then
              cat health.json
              grep -q '"status":"ok"' health.json
              grep -q '"service":"vcdesk-signaling"' health.json
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting 10 seconds..."
            sleep 10
          done
          echo "Health endpoint did not become healthy."
          exit 1

      - name: Test WebSocket room signaling
        shell: bash
        run: |
          mkdir smoke-test
          cd smoke-test
          go mod init vcdesk-smoke-test
          go get github.com/gorilla/websocket@v1.5.3
          cat > main.go <<'EOF'
          package main

          import (
            "encoding/json"
            "fmt"
            "net/http"
            "time"

            "github.com/gorilla/websocket"
          )

          const endpoint = "wss://vcdesk-signaling-babooeyererererererte.onrender.com/ws"
          var testRoom string

          func connect(name string) *websocket.Conn {
            header := http.Header{}
            header.Set("Origin", "wails://wails")
            conn, response, err := websocket.DefaultDialer.Dial(endpoint, header)
            if err != nil {
              if response != nil { panic(fmt.Sprintf("connect %s: %v (HTTP %s)", name, err, response.Status)) }
              panic(fmt.Sprintf("connect %s: %v", name, err))
            }
            conn.SetReadDeadline(time.Now().Add(20 * time.Second))
            payload := map[string]any{"type":"join", "room":testRoom, "name":name}
            if err := conn.WriteJSON(payload); err != nil { panic(err) }
            return conn
          }

          func readType(conn *websocket.Conn, expected string) map[string]any {
            _, raw, err := conn.ReadMessage()
            if err != nil { panic(fmt.Sprintf("waiting for %s: %v", expected, err)) }
            var message map[string]any
            if err := json.Unmarshal(raw, &message); err != nil { panic(err) }
            if message["type"] != expected { panic(fmt.Sprintf("expected %s, got %#v", expected, message)) }
            return message
          }

          func main() {
            // Use a unique room for every run so stale clients or concurrent tests cannot occupy it.
            testRoom = fmt.Sprintf("vcdesk-smoke-%d", time.Now().UnixNano())
            first := connect("smoke-one")
            defer first.Close()
            second := connect("smoke-two")
            defer second.Close()

            joined := readType(first, "peer-joined")
            if joined["name"] != "smoke-two" { panic(fmt.Sprintf("unexpected peer name: %#v", joined)) }
            offer := map[string]any{"type":"description", "room":testRoom, "name":"smoke-one", "description":map[string]any{"type":"offer","sdp":"smoke-test"}}
            if err := first.WriteJSON(offer); err != nil { panic(err) }
            relayed := readType(second, "description")
            if relayed["name"] != "smoke-one" { panic(fmt.Sprintf("unexpected relayed sender: %#v", relayed)) }

            third := connect("smoke-three")
            defer third.Close()
            readType(third, "room-full")
            fmt.Println("PASS: WebSocket handshake, two-person room, peer notification, message relay, and room capacity.")
          }
          EOF
          go run .
